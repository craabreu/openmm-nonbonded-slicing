name: build
channels:
  - conda-forge
dependencies:
  - cmake
  - cuda-version =@CUDA_VERSION@
  - cuda-nvcc
  - cuda-cudart-dev
  - cuda-nvrtc-dev
  - libcufft-dev
  - gxx_linux-64 =@COMPILER_VERSION@
  - make
  - ocl-icd-system
  - opencl-headers
  - openmm =@OPENMM_VERSION@
  - pip >=22.2
  - pytest
  - python
  - doxygen
  - setuptools
  - swig =@SWIG_VERSION@
  - sysroot_linux-64
  - numpy
