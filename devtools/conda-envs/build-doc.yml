name: build
channels:
  - conda-forge
dependencies:
  - cmake
  - gxx_linux-64 =@COMPILER_VERSION@
  - make
  - openmm =@OPENMM_VERSION@
  - pip >=22.2
  - pytest
  - python
  - doxygen
  - setuptools
  - swig =@SWIG_VERSION@
  - numpy

  # Docs depends
  - sphinx
  - sphinxcontrib-bibtex
  - sphinx-copybutton